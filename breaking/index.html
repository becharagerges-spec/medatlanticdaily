<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MedAtlantic Daily · Breaking</title>
<style>
:root{--ground:#F6F4EF;--ink:#171614;--ink-2:#48463F;--ink-3:#7A776F;--hair:#D8D4CB;--card:#FFFFFF;--card-2:#EFECE5;--link:#1A5DAB;--esc:#C2413A;--rep:#A86A00;--ok:#2E7D4F;
--f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--f-ar:-apple-system,BlinkMacSystemFont,"SF Arabic","Noto Sans Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif}
@media (prefers-color-scheme:dark){:root{--ground:#1F1F21;--ink:#F3F1EC;--ink-2:#C9C6BF;--ink-3:#8E8B84;--hair:#3A3A3E;--card:#2A2A2D;--card-2:#262628;--link:#8AB4F8;--esc:#E0695E;--rep:#E2B04A;--ok:#5FBF7A}}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 var(--f-ui);-webkit-text-size-adjust:100%}
body.ar{direction:rtl;font-family:var(--f-ar);font-size:17px;line-height:1.8}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:var(--ground);border-bottom:1px solid var(--hair);padding:12px 0 10px}
.top{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{color:var(--ink);text-decoration:none;display:flex;flex-direction:column;min-width:0}
.brand b{font:800 21px/1.1 var(--f-ui);letter-spacing:-.02em;white-space:nowrap}
.brand span{font:600 12.5px/1.3 var(--f-ui);color:var(--esc);letter-spacing:.12em;text-transform:uppercase}
body.ar .brand span{font-family:var(--f-ar);letter-spacing:0;font-size:14px}
.lang{border:1px solid var(--hair);background:var(--card);color:var(--ink);font:600 14px/1 var(--f-ui);padding:9px 14px;border-radius:999px;cursor:pointer;flex:none}
.meta{color:var(--ink-3);font-size:13px;margin:14px 0 4px}
.report{display:inline-block;margin:4px 0 10px;color:var(--link);font-size:14.5px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:4.6em 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.t{font:700 14px/1.3 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink);direction:ltr;text-align:start}
.t small{display:block;font-weight:500;color:var(--ink-3);font-size:12px;margin-top:3px}
.h{font-size:16.5px;font-weight:600;line-height:1.45}
body.ar .h{font-size:17.5px;line-height:1.75}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12.5px;color:var(--ink-3);align-items:center}
.pill{border:1px solid currentColor;border-radius:999px;padding:1px 8px;font-weight:600}
.pill.reported{color:var(--rep)}.pill.confirmed{color:var(--ok)}.pill.new{color:var(--esc)}
.tags a{color:var(--link)}
.day{font:700 12px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding:22px 0 6px;border-bottom:2px solid var(--ink)}
body.ar .day{font-family:var(--f-ar);letter-spacing:0;font-size:14px}
.empty{color:var(--ink-3);padding:24px 0}
</style>
</head>
<body>
<header><div class="top">
<a class="brand" href="/"><b>MedAtlantic Daily</b><span data-en="Breaking · newest first" data-ar="عاجل · الأحدث أولاً">Breaking · newest first</span></a>
<button class="lang" id="lang" type="button">عربي</button>
</div></header>
<div class="wrap">
<div class="meta" id="meta" data-en="Loading…" data-ar="جارٍ التحميل…">Loading…</div>
<a class="report" href="/" data-en="Read today's full report →" data-ar="← اقرأ التقرير الكامل لليوم">Read today's full report →</a>
<noscript><p class="empty">This page needs JavaScript to show the latest items. The full report is on the home page.</p></noscript>
<div id="list"></div>
</div>
<script>
(function(){
var L="en";try{L=localStorage.getItem("ma_bk_lang")||"en";}catch(e){}
var TH={lebanon:["Lebanon","لبنان"],usa:["United States","الولايات المتحدة"],israel:["Israel","إسرائيل"],saudi:["Saudi Arabia","السعودية"],iraq:["Iraq","العراق"],iran:["Iran","إيران"],mideast:["Middle East","الشرق الأوسط"],gulf:["The Gulf","الخليج"],europe:["Europe","أوروبا"],russia:["Russia","روسيا"],ukraine:["Ukraine","أوكرانيا"],africa:["Africa","أفريقيا"],china:["China","الصين"],markets:["Markets","الأسواق"],world:["World","العالم"]};
var ST={confirmed:["Confirmed","مؤكد"],reported:["Reported","منقول"]};
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],MAR=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
var data=null;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function riy(iso){var d=new Date(iso);if(isNaN(d))return null;return new Date(d.getTime()+3*3600e3);}
function hm(r){return("0"+r.getUTCHours()).slice(-2)+":"+("0"+r.getUTCMinutes()).slice(-2);}
function dayKey(r){return r.getUTCFullYear()+"-"+r.getUTCMonth()+"-"+r.getUTCDate();}
function dayLabel(r){return L=="ar"?(r.getUTCDate()+" "+MAR[r.getUTCMonth()]+" "+r.getUTCFullYear()):(r.getUTCDate()+" "+MON[r.getUTCMonth()]+" "+r.getUTCFullYear());}
function ago(iso){var m=Math.round((Date.now()-new Date(iso).getTime())/60000);if(isNaN(m))return"";if(m<60)return L=="ar"?("قبل "+Math.max(m,1)+" د"):(Math.max(m,1)+" min ago");var h=Math.floor(m/60);if(h<24)return L=="ar"?("قبل "+h+" س"):(h+" h ago");return"";}
function safe(u){return typeof u=="string"&&/^https:\/\//.test(u)&&!/claude\.ai|anthropic|openai|chatgpt|gemini\.google|drive\.google|docs\.google|mail\.google|gmail/i.test(u);}
function statics(){document.body.className=L=="ar"?"ar":"";document.documentElement.lang=L;document.getElementById("lang").textContent=L=="ar"?"EN":"عربي";
var n=document.querySelectorAll("[data-en]");for(var i=0;i<n.length;i++)n[i].textContent=n[i].getAttribute("data-"+L);}
function render(){statics();var list=document.getElementById("list"),meta=document.getElementById("meta");
if(!data||!data.items){return;}
var it=data.items.slice().sort(function(a,b){return a.time<b.time?1:-1;});
var up=riy(data.updated);meta.textContent=(L=="ar"?"آخر تحديث ":"Last updated ")+(up?hm(up)+" · "+dayLabel(up):"");
if(!it.length){list.innerHTML='<p class="empty">'+(L=="ar"?"لا أخبار عاجلة حالياً.":"No breaking items at the moment.")+"</p>";return;}
var h="",cur="";
for(var i=0;i<it.length;i++){var x=it[i],r=riy(x.time);if(!r)continue;var k=dayKey(r);
if(k!=cur){if(cur)h+="</ol>";h+='<div class="day">'+esc(dayLabel(r))+"</div><ol>";cur=k;}
var th=TH[x.theater]||[x.theater||"",x.theater||""],st=ST[x.status]||ST.reported,a=ago(x.time),fresh=(Date.now()-new Date(x.time).getTime())<3600e3;
var src=x.source||{},sname=esc(src.name||""),link=safe(src.url)?'<a href="'+esc(src.url)+'" target="_blank" rel="noopener">'+sname+"</a>":sname;
var txt=(L=="ar"?(x.ar||x.en):(x.en||x.ar));
h+='<li><div class="t">'+hm(r)+(a?"<small>"+esc(a)+"</small>":"")+'</div><div><div class="h">'+esc(txt)+'</div><div class="tags">'+(fresh?'<span class="pill new">'+(L=="ar"?"جديد":"New")+"</span>":"")+'<span class="pill '+(x.status=="confirmed"?"confirmed":"reported")+'">'+esc(st[L=="ar"?1:0])+"</span><span>"+esc(th[L=="ar"?1:0])+"</span>"+(link?"<span>·</span>"+link:"")+"</div></div></li>";}
if(cur)h+="</ol>";list.innerHTML=h;}
function load(){var x=new XMLHttpRequest();x.open("GET","feed.json?v="+Date.now(),true);
x.onload=function(){if(x.status==200){try{data=JSON.parse(x.responseText);}catch(e){}}render();if(!data)document.getElementById("meta").textContent=L=="ar"?"تعذّر التحميل، أعد المحاولة لاحقاً.":"Could not load the feed; try again shortly.";};
x.onerror=function(){if(!data)document.getElementById("meta").textContent=L=="ar"?"تعذّر التحميل، أعد المحاولة لاحقاً.":"Could not load the feed; try again shortly.";};x.send();}
document.getElementById("lang").onclick=function(){L=L=="ar"?"en":"ar";try{localStorage.setItem("ma_bk_lang",L);}catch(e){}render();};
statics();load();setInterval(load,300000);
})();
</script>
</body>
</html>
